# ╔══════════════════════════════════════════════════════╗
# ║  🎮 AWA Fuzzy Search Backend — 配置文件              ║
# ╚══════════════════════════════════════════════════════╝

# ──────────────────────────────────────────
# 🖥️  推理设备: cuda / cpu
# ──────────────────────────────────────────
device: cuda

# ──────────────────────────────────────────
# 🌐 服务监听
# ──────────────────────────────────────────
host: "0.0.0.0"
port: 60615

# ──────────────────────────────────────────
# 🎮 Minecraft 版本
# 对应 static/<version>/textures/ 目录
# 不同版本可用 scripts/download_mc_textures.py 下载
# ──────────────────────────────────────────
mc_version: "26.1.2"

# ──────────────────────────────────────────
# 🌍 代理地址（用于 HuggingFace 模型下载）
# 不需要则设为 null
# 示例: "http://127.0.0.1:7890"
# ──────────────────────────────────────────
proxy: null

# ──────────────────────────────────────────
# 💾 模型缓存目录
# null          
#               → 使用 HF 默认路径 ~/.cache/huggingface
# "models"  
#               → 下载到项目内 models/ 目录（已 gitignore）
# "/path/to/models"     
#               → 也可以填绝对路径
# ──────────────────────────────────────────
models_cache_dir: null
